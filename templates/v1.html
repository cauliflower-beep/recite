<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>古诗文抽背 | 摇头晃脑版</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --ink: #2b2b2b;
            --paper: #f4f3ee;
            --gold: #f39c12; 
            --border: 4px solid var(--ink);
            --shadow: 10px 10px 0 rgba(43, 43, 43, 0.2);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: "Songti SC", "Noto Serif SC", serif;
            background: #dcd9d1;
            color: var(--ink);
            min-height: 100svh;
            overflow: hidden;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
            transition: filter 1s; 
        }

        /* --- 漫画集中线 --- */
        .speed-lines {
            position: absolute;
            top: 50%; left: 50%;
            width: 200vmax; height: 200vmax;
            background: repeating-conic-gradient(transparent 0 2deg, rgba(0,0,0,0.1) 2deg 4deg);
            transform: translate(-50%, -50%) rotate(0deg);
            z-index: 1; opacity: 0; pointer-events: none; transition: opacity 0.2s;
        }
        .show-lines { opacity: 1; animation: spin-lines 10s linear infinite; }
        @keyframes spin-lines { to { transform: translate(-50%, -50%) rotate(360deg); } }

        /* --- 背景 Canvas --- */
        #bgCanvas {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 0; opacity: 0.5;
        }

        /* --- 顶部栏 --- */
        header {
            position: relative; z-index: 10; padding: 20px 40px;
            display: flex; justify-content: space-between; align-items: center;
        }
        .logo {
            font-size: clamp(1.2rem, 5vw, 2rem); font-weight: 900; letter-spacing: clamp(1px, 1vw, 4px);
            background: var(--ink); color: #fff; padding: 5px 15px;
            transform: skew(-10deg); box-shadow: 4px 4px 0 rgba(0,0,0,0.3);
        }
        .settings-btn {
            cursor: pointer; font-weight: bold; padding: 8px 16px;
            border: 2px solid var(--ink); background: #fff;
            transition: 0.2s; box-shadow: 3px 3px 0 var(--ink);
        }
        .settings-btn:active { transform: translate(2px, 2px); box-shadow: none; }

        /* --- 主舞台 --- */
        main {
            position: relative; z-index: 5; flex: 1;
            display: flex; justify-content: center; align-items: center;
            perspective: 1000px;
            padding: 0 12px 24px;
        }

        .card-frame {
            width: min(800px, 95vw);
            background: var(--paper);
            border: var(--border);
            padding: clamp(20px, 5vw, 50px);
            position: relative;
            box-shadow: var(--shadow);
            transform-style: preserve-3d;
            background-image: url("data:image/svg+xml,%3Csvg width='40' height='40' viewBox='0 0 40 40' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M0 0h40v40H0V0zm20 20h20v20H20V20zM0 20h20v20H0V20z' fill='%23e6e2d8' fill-opacity='0.4' fill-rule='evenodd'/%3E%3C/svg%3E");
        }

        /* 名字显示区 */
        .slot-window {
            height: 140px; overflow: hidden; position: relative;
            border-top: 2px solid #ccc; border-bottom: 2px solid #ccc; margin-bottom: 20px;
        }
        .slot-item {
            height: 140px; line-height: 140px;
            font-size: clamp(3.0rem, 10vw, 5rem); font-weight: 900;
            text-align: center; white-space: nowrap; color: var(--ink);
        }
        .highlight-comic {
            color: var(--gold); -webkit-text-stroke: 3px var(--ink);
            text-shadow: 5px 5px 0px rgba(0,0,0,0.2);
            transform: scale(1.1) skew(-5deg);
        }

        /* 题目 */
        .poem-title {
            font-size: clamp(1.25rem, 5.5vw, 2rem); font-weight: bold; color: #555;
            min-height: 3rem; margin-top: 15px; opacity: 0;
            transform: translateY(20px); transition: 0.5s;
        }
        .poem-title.show { opacity: 1; transform: translateY(0); color: var(--ink); }

        /* 提示区 */
        .hint-box {
            margin-top: 20px; padding: 10px; border: 2px dashed #bbb;
            opacity: 0; pointer-events: none; transition: 0.3s;
        }
        .hint-content { filter: blur(8px); transition: 0.3s; font-size: 1.2rem; margin-top:5px;}
        .hint-box:hover .hint-content { filter: blur(0); }

        /* --- 关键动画调整区域 --- */

        /* 1. 摇头晃脑 (Reciting Shake) - 来源于 V3 并增强 */
        @keyframes head-bobbing {
            0% { transform: translate(0, 0) rotate(0deg); }
            15% { transform: translate(-4px, 1px) rotate(-1.5deg); } /* 左倾 */
            30% { transform: translate(0px, 2px) rotate(0deg); }     /* 回正沉思 */
            45% { transform: translate(4px, 1px) rotate(1.5deg); }   /* 右倾 */
            60% { transform: translate(0px, 0px) rotate(0deg); }
            75% { transform: translate(-2px, -1px) rotate(-1deg); }  /* 轻微晃动 */
            90% { transform: translate(2px, 1px) rotate(1deg); }
            100% { transform: translate(0, 0) rotate(0deg); }
        }
        /* 时间设为 2.5秒，慢悠悠的感觉 */
        .shake-reciting { animation: head-bobbing 2.5s infinite ease-in-out; }

        /* 2. 暴击砸地 (Slam) */
        .slam-hit { animation: slam 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @keyframes slam { 0% { transform: scale(1.5); opacity:0; } 100% { transform: scale(1); opacity:1; } }

        /* 3. 失败颓废 (Fail) */
        .droop-fail { animation: droop 1s forwards; filter: grayscale(1); }
        @keyframes droop { 0% { transform: rotate(0deg); } 100% { transform: rotate(5deg) translateY(30px); box-shadow: none; } }

        /* 4. 成功印章 (Stamp) */
        #stamp {
            position: absolute; top: 20%; right: 10%; width: clamp(120px, 30vw, 200px); height: clamp(120px, 30vw, 200px);
            border: 5px solid #c0392b; border-radius: 50%; color: #c0392b;
            font-size: clamp(26px, 6.5vw, 40px); font-weight: bold; display: flex; justify-content: center; align-items: center;
            transform: scale(3); opacity: 0; pointer-events: none;
            text-transform: uppercase; letter-spacing: 5px; background: rgba(255,255,255,0.8);
            z-index: 20; transform: rotate(-20deg) scale(3);
        }
        .stamp-anim { animation: stamp-down 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        @keyframes stamp-down { to { transform: rotate(-20deg) scale(1); opacity: 1; } }

        /* --- 按钮 --- */
        .controls { margin-top: 40px; min-height: 80px; display: flex; justify-content: center; gap: 20px; flex-wrap: wrap;}
        .btn {
            border: 3px solid var(--ink); background: #fff; padding: 14px clamp(18px, 6vw, 40px);
            font-size: clamp(1.0rem, 3.8vw, 1.2rem); font-weight: bold; cursor: pointer; box-shadow: 5px 5px 0 var(--ink);
            transition: 0.1s;
        }
        .btn:active { transform: translate(3px, 3px); box-shadow: 2px 2px 0 var(--ink); }
        .btn-start { background: var(--gold); color: #fff; }
        .btn-stop { background: #e74c3c; color: #fff; animation: pulse 0.5s infinite; }
        @keyframes pulse { 50% { transform: scale(1.05); } }

        .result-group { display: none; gap: 20px; }
        .btn-pass { background: #27ae60; color: #fff; }
        .btn-fail { background: #7f8c8d; color: #fff; }

        /* 状态栏 */
        .status { position: absolute; bottom: 10px; width: 100%; text-align: center; color: #777; font-size: 0.9rem; }

        /* 弹窗 */
        .modal { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:99; justify-content:center; align-items:center; }
        .modal-box { background:#fff; padding:30px; width:min(500px, 92vw); border:4px solid var(--ink); }
        textarea { width:100%; height:100px; margin-bottom:15px; border:2px solid #ccc; font-family:inherit; padding:10px; }

        @media (max-width: 520px) {
            body { overflow-y: auto; }
            header { padding: 14px 12px; gap: 10px; flex-wrap: wrap; justify-content: center; }
            .settings-btn { padding: 8px 12px; }

            main { align-items: flex-start; padding: 0 10px 18px; perspective: 800px; }
            .card-frame { max-width: 100%; }

            .slot-window { height: 120px; margin-bottom: 14px; }
            .slot-item { height: 120px; line-height: 120px; -webkit-text-stroke-width: 2px; text-shadow: 4px 4px 0px rgba(0,0,0,0.2); }

            .controls { margin-top: 22px; gap: 12px; }
            .btn { box-shadow: 4px 4px 0 var(--ink); }

            .hint-content { font-size: 1.05rem; }

            .status { position: static; margin: 10px 0 16px; }
        }

    </style>
</head>
<body>

    <div class="speed-lines" id="speedLines"></div>
    <canvas id="bgCanvas"></canvas>

    <header>
        <div class="logo">摇头版</div>
        <div class="settings-btn" onclick="openSettings()">配置数据</div>
    </header>

    <main>
        <div class="card-frame" id="mainCard">
            <div id="stamp">背诵<br>通关</div>

            <div class="slot-window">
                <div class="slot-strip" id="slotStrip">
                    <div class="slot-item">准备</div>
                </div>
            </div>

            <div class="poem-title" id="poemTitle">《等待挑战》</div>

            <div class="controls">
                <button class="btn btn-start" id="mainBtn" onclick="handleAction()">开始挑战 (Space)</button>
                <div class="result-group" id="resultBtns">
                    <button class="btn btn-pass" onclick="finish(true)">🎉 完美绝杀</button>
                    <button class="btn btn-fail" onclick="finish(false)">🌧️ 遗憾离场</button>
                </div>
            </div>

            <div class="hint-box" id="hintBox">
                <div style="font-size:0.8rem; color:#999; margin-bottom:5px;">💡 老师把鼠标移上来查看提示</div>
                <div class="hint-content" id="hintText">...</div>
            </div>
        </div>
    </main>

    <div class="status" id="statusText">加载中...</div>

    <!-- 设置弹窗 -->
    <div class="modal" id="settingsModal">
        <div class="modal-box">
            <h3>数据配置</h3>
            <p><strong>学生名单</strong> (每行一个)</p>
            <textarea id="sInput"></textarea>
            <p><strong>题库</strong> (标题#内容)</p>
            <textarea id="pInput"></textarea>
            <div style="text-align:right;">
                <button class="btn" onclick="closeSettings()" style="background:#eee; margin-right:10px;">取消</button>
                <button class="btn btn-start" onclick="saveSettings()">保存</button>
            </div>
        </div>
    </div>

    <script>
        // --- Canvas 动画 (保持不变) ---
        const canvas = document.getElementById('bgCanvas');
        const ctx = canvas.getContext('2d');
        let mode = 'float';
        let particles = [];
        const words = ["墨", "韵", "风", "骨", "雅", "颂", "诗", "酒", "剑", "气"];

        function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', resize);
        resize();

        class Particle {
            constructor() { this.reset(); }
            reset() {
                if (mode === 'float') {
                    this.x = Math.random() * canvas.width;
                    this.y = canvas.height + 50;
                    this.speed = Math.random() * 0.5 + 0.2;
                    this.text = words[Math.floor(Math.random() * words.length)];
                    this.opacity = 0;
                } else {
                    this.x = Math.random() * canvas.width;
                    this.y = Math.random() * -100;
                    this.speed = Math.random() * 10 + 10;
                    this.len = Math.random() * 20 + 10;
                    this.opacity = 0.5;
                }
            }
            update() {
                if (mode === 'float') {
                    this.y -= this.speed;
                    if (this.y < canvas.height - 100) this.opacity += 0.01;
                    if (this.y < 100) this.opacity -= 0.01;
                    if (this.y < -50) this.reset();
                } else {
                    this.y += this.speed;
                    if (this.y > canvas.height) this.reset();
                }
            }
            draw() {
                ctx.beginPath();
                if (mode === 'float') {
                    ctx.fillStyle = `rgba(50,50,50,${this.opacity})`;
                    ctx.font = "30px 'Songti SC'";
                    ctx.fillText(this.text, this.x, this.y);
                } else {
                    ctx.strokeStyle = `rgba(100,100,100,${this.opacity})`;
                    ctx.lineWidth = 1;
                    ctx.moveTo(this.x, this.y);
                    ctx.lineTo(this.x, this.y + this.len);
                    ctx.stroke();
                }
            }
        }

        function initParticles() {
            particles = [];
            for(let i=0; i<30; i++) particles.push(new Particle());
            for(let i=0; i<100; i++) if(mode === 'rain') particles.push(new Particle()); 
        }
        function animate() {
            ctx.clearRect(0,0,canvas.width, canvas.height);
            particles.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animate);
        }
        initParticles();
        animate();

        function toggleRain(enable) {
            mode = enable ? 'rain' : 'float';
            initParticles();
            document.body.style.filter = enable ? "grayscale(100%) brightness(0.9)" : "none";
        }

        // --- 核心逻辑 ---
        const defaultS = ["别骂了在改了", "可爱到违规", "摆烂但优雅", "熬夜总冠军", "佛系小废物", "芝士就是力量"];
        const defaultP = [{t:"《将进酒》", c:"君不见黄河之水天上来..."}, {t:"《蜀道难》", c:"噫吁嚱，危乎高哉！"}];
        let students=[], poems=[], pool=[];
        let isRunning = false;
        
        const slotStrip = document.getElementById('slotStrip');
        const mainBtn = document.getElementById('mainBtn');
        const resultGroup = document.getElementById('resultBtns');
        const card = document.getElementById('mainCard');
        const poemTitle = document.getElementById('poemTitle');
        const hintBox = document.getElementById('hintBox');
        const hintText = document.getElementById('hintText');
        const speedLines = document.getElementById('speedLines');
        const stamp = document.getElementById('stamp');
        const statusText = document.getElementById('statusText');

        function init() {
            let s = localStorage.getItem('v4_s');
            let p = localStorage.getItem('v4_p');
            students = s ? JSON.parse(s) : [...defaultS];
            poems = p ? JSON.parse(p) : [...defaultP];
            pool = [...students];
            updateStatus();
        }

        function updateStatus() {
            statusText.innerText = `当前幸存者：${pool.length} / 全班：${students.length}`;
        }

        let currentS, currentP;
        
        function handleAction() {
            if(pool.length === 0) return alert("🎉 全员通关！");
            if(!isRunning) startRoll();
            else stopRoll();
        }

        function startRoll() {
            isRunning = true;
            mainBtn.innerText = "停！";
            mainBtn.className = "btn btn-stop";
            resultGroup.style.display = "none";
            hintBox.style.opacity = 0;
            poemTitle.classList.remove('show');
            stamp.classList.remove('stamp-anim');
            card.className = "card-frame"; // 重置所有动画
            toggleRain(false); 

            let html = "";
            for(let i=0; i<40; i++) html += `<div class="slot-item">${pool[Math.floor(Math.random()*pool.length)]}</div>`;
            slotStrip.innerHTML = html;
            
            let offset = 0;
            function loop() {
                offset += 50;
                if(offset > slotStrip.scrollHeight/2) offset = 0;
                slotStrip.style.transform = `translateY(-${offset}px)`;
                if(isRunning) requestAnimationFrame(loop);
            }
            loop();
        }

        function stopRoll() {
            isRunning = false;
            currentS = pool[Math.floor(Math.random()*pool.length)];
            currentP = poems[Math.floor(Math.random()*poems.length)];

            slotStrip.innerHTML = `<div class="slot-item highlight-comic">${currentS}</div>`;
            slotStrip.style.transform = `translateY(0)`;
            
            speedLines.classList.add('show-lines'); 
            card.classList.add('slam-hit'); 
            setTimeout(() => speedLines.classList.remove('show-lines'), 500); 

            setTimeout(() => {
                card.classList.remove('slam-hit');
                // 关键修改：换成了 "shake-reciting" (摇头晃脑)
                card.classList.add('shake-reciting'); 
                
                poemTitle.innerText = currentP.t;
                poemTitle.classList.add('show');
                hintText.innerText = currentP.c;
                hintBox.style.opacity = 1;
                hintBox.style.pointerEvents = "auto";
                
                mainBtn.style.display = "none";
                resultGroup.style.display = "flex";
            }, 300);
        }

        function finish(pass) {
            card.classList.remove('shake-reciting'); // 停止摇头

            if (pass) {
                stamp.classList.add('stamp-anim');
                confetti({ particleCount: 150, spread: 100, origin: { y: 0.6 } });
                pool = pool.filter(s => s !== currentS);
            } else {
                toggleRain(true);
                card.classList.add('droop-fail');
            }
            updateStatus();
            setTimeout(() => {
                mainBtn.style.display = "block";
                mainBtn.className = "btn btn-start";
                mainBtn.innerText = "下一位";
                resultGroup.style.display = "none";
            }, 1000);
        }

        // --- 设置 (复用) ---
        const modal = document.getElementById('settingsModal');
        const sInput = document.getElementById('sInput');
        const pInput = document.getElementById('pInput');
        function openSettings() {
            sInput.value = students.join('\n');
            pInput.value = poems.map(p=>`${p.t}#${p.c}`).join('\n');
            modal.style.display = "flex";
        }
        function closeSettings() { modal.style.display = "none"; }
        function saveSettings() {
            let s = sInput.value.split('\n').filter(x=>x.trim());
            let p = pInput.value.split('\n').filter(x=>x.trim()).map(x=>{let[t,c]=x.split('#');return{t,c}});
            if(s.length) students=s; if(p.length) poems=p;
            localStorage.setItem('v4_s', JSON.stringify(students));
            localStorage.setItem('v4_p', JSON.stringify(poems));
            pool = [...students]; updateStatus(); closeSettings();
        }
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space' && modal.style.display !== 'flex') {
                e.preventDefault();
                if (mainBtn.offsetParent) handleAction();
            }
        });
        init();
    </script>
</body>
</html>
